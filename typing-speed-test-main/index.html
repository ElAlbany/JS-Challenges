<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | Typing Speed Test</title>
    <script
      src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"
      defer
    ></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <picture>
            <!-- Desktop: show large logo -->
            <source
              srcset="./assets/images/logo-large.svg"
              media="(min-width: 48rem)"
            />
            <!-- Fallback for everything else (mobile & small screens) -->
            <img
              class="brand-icon"
              src="./assets/images/logo-small.svg"
              alt="Typing Speed Test"
            />
          </picture>
        </div>

        <section class="best-score hidden" aria-live="polite">
          <img src="./assets/images/icon-personal-best.svg" alt="" />
          <p>
            <span class="best-label best-label-mobile">Best:</span>
            <span class="best-label best-label-desktop">Personal best:</span>
            <strong id="best-score-number">0</strong> WPM
          </p>
        </section>
      </header>

      <section class="stats-bar" aria-label="Typing test status and controls">
        <div class="stats-row">
          <article class="stat-item">
            <span class="stat-label">WPM:</span>
            <strong id="wpm-number">0</strong>
          </article>
          <article class="stat-item">
            <span class="stat-label">Accuracy:</span>
            <strong id="accuracy-number">100%</strong>
          </article>
          <article class="stat-item">
            <span class="stat-label">Time:</span>
            <strong id="time-number">0:60</strong>
          </article>
        </div>

        <div class="desktop-controls" aria-label="Typing test controls">
          <div class="control-cluster">
            <span class="control-label">Difficulty:</span>
            <div class="pill-group" role="group" aria-label="Difficulty">
              <button class="control-pill" type="button" data-difficulty="easy">
                Easy
              </button>
              <button
                class="control-pill"
                type="button"
                data-difficulty="medium"
              >
                Medium
              </button>
              <button class="control-pill" type="button" data-difficulty="hard">
                Hard
              </button>
            </div>
          </div>

          <div class="control-cluster mode-cluster">
            <span class="control-label">Mode:</span>
            <div class="pill-group" role="group" aria-label="Mode">
              <button class="control-pill" type="button" data-mode="timed">
                Timed (60s)
              </button>
              <button class="control-pill" type="button" data-mode="passage">
                Passage
              </button>
            </div>
          </div>
        </div>

        <div class="mobile-controls" aria-label="Typing test controls">
          <div class="dropdown-control" data-dropdown="difficulty">
            <button
              class="dropdown-trigger"
              id="difficulty-trigger"
              type="button"
              aria-expanded="false"
              aria-controls="difficulty-menu"
            >
              <span id="difficulty-value">Hard</span>
              <img src="./assets/images/icon-down-arrow.svg" alt="" />
            </button>
            <div class="dropdown-menu" id="difficulty-menu" role="menu">
              <button
                class="dropdown-option"
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-difficulty="easy"
              >
                <span class="radio-dot" aria-hidden="true"></span>
                Easy
              </button>
              <button
                class="dropdown-option"
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-difficulty="medium"
              >
                <span class="radio-dot" aria-hidden="true"></span>
                Medium
              </button>
              <button
                class="dropdown-option"
                type="button"
                role="menuitemradio"
                aria-checked="true"
                data-difficulty="hard"
              >
                <span class="radio-dot" aria-hidden="true"></span>
                Hard
              </button>
            </div>
          </div>

          <div class="dropdown-control" data-dropdown="mode">
            <button
              class="dropdown-trigger"
              id="mode-trigger"
              type="button"
              aria-expanded="false"
              aria-controls="mode-menu"
            >
              <span id="mode-value">Timed (60s)</span>
              <img src="./assets/images/icon-down-arrow.svg" alt="" />
            </button>
            <div class="dropdown-menu" id="mode-menu" role="menu">
              <button
                class="dropdown-option"
                type="button"
                role="menuitemradio"
                aria-checked="true"
                data-mode="timed"
              >
                <span class="radio-dot" aria-hidden="true"></span>
                Timed (60s)
              </button>
              <button
                class="dropdown-option"
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-mode="passage"
              >
                <span class="radio-dot" aria-hidden="true"></span>
                Passage
              </button>
            </div>
          </div>
        </div>
      </section>

      <main class="typing-screen" id="typing-screen">
        <section class="passage-shell" aria-label="Typing passage">
          <div
            class="text-container blurred"
            id="text-container"
            tabindex="0"
          ></div>
          <div class="start-overlay" id="start-overlay">
            <button class="start-btn" id="start-button" type="button">
              Start Typing Test
            </button>
            <p>Or click the text and start typing</p>
          </div>
        </section>

        <div class="restart-area hidden" id="restart-area">
          <button class="restart-btn" id="restart-button" type="button">
            <span>Restart Test</span>
            <img src="./assets/images/icon-restart.svg" alt="" />
          </button>
        </div>
      </main>

      <section
        class="results-screen hidden"
        id="results-screen"
        aria-live="polite"
        aria-labelledby="result-heading"
      >
        <img
          class="result-decor decor-left"
          src="./assets/images/pattern-star-2.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="result-decor decor-right"
          src="./assets/images/pattern-star-1.svg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="confetti-pattern"
          src="./assets/images/pattern-confetti.svg"
          alt=""
          aria-hidden="true"
        />

        <div class="result-content">
          <img
            class="result-icon"
            id="result-icon"
            src="./assets/images/icon-completed.svg"
            alt=""
          />
          <h2 id="result-heading">Test Complete!</h2>
          <p id="result-subtitle">
            Solid run. Keep pushing to beat your high score.
          </p>

          <div class="result-cards" aria-label="Test results">
            <article class="result-card">
              <span>WPM:</span>
              <strong id="result-wpm">0</strong>
            </article>
            <article class="result-card">
              <span>Accuracy:</span>
              <strong id="result-accuracy">100%</strong>
            </article>
            <article class="result-card">
              <span>Characters</span>
              <strong class="characters-score">
                <span id="result-correct">0</span><span>/</span
                ><span id="result-errors">0</span>
              </strong>
            </article>
          </div>

          <button class="result-action" id="result-action" type="button">
            <span id="result-action-text">Go Again</span>
            <img src="./assets/images/icon-restart.svg" alt="" />
          </button>
        </div>
      </section>

      <textarea
        class="typing-input"
        id="typing-input"
        aria-label="Typing input"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        tabindex="-1"
      ></textarea>
    </div>
  </body>
</html>
